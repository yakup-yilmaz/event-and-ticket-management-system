spring.application.name=ticketsystem
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hangi driver kullan\u0131lacak
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA ayarlar\u0131
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT Security Configuration
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_ACCESS_EXPIRATION_MS:900000}
application.security.jwt.refresh-token.expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Varsayılan ADMIN (yoksa bootstrap ile oluşturulur)
app.admin.email=${ADMIN_EMAIL:admin@ticketsystem.local}
app.admin.password=${ADMIN_PASSWORD}